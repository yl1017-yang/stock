name: Daily Stock Analysis & Deploy

on:
  push:
    branches: [ "main" ]
  schedule:
    # 매일 오후 3시 40분 (KST) 실행 (UTC 기준 06:40)
    - cron: '40 6 * * *'
  workflow_dispatch: # 수동 실행 가능

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  analyze-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Analysis
        if: github.event_name != 'push'
        env:
          TZ: Asia/Seoul
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          TOSS_ACCOUNT_SEQ: ${{ secrets.TOSS_ACCOUNT_SEQ }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python main.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare public files
        run: |
          mkdir -p public
          cp index.html style.css script.js data.json public/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # index.html이 있는 경로 업로드
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
